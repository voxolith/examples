name: Deploy to GitHub Pages

# Builds the app and publishes dist/ to GitHub Pages on every push to main.
# The app depends on the engine, the generators and the renderer as
# "workspace:*", so each is checked out next to it and they are installed from a
# temporary bun workspace root. Once those are on npm this can shrink to a plain
# checkout + bun install.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/checkout@v4
        with:
          repository: voxolith/renderer
          path: renderer
      - uses: actions/checkout@v4
        with:
          repository: voxolith/engine
          path: engine
      - uses: actions/checkout@v4
        with:
          repository: voxolith/generators
          path: generators
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Create workspace root
        run: |
          cat > package.json <<'JSON'
          { "name": "pages-workspace", "private": true, "workspaces": ["app", "renderer", "engine", "generators/*"] }
          JSON
      - run: bun install
      - name: Build
        working-directory: app
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

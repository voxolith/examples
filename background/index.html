<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>background — Voxolith Examples</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151B29" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F4EE" />
    <script>try{var t=localStorage.getItem("voxolith-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="hud"><div class="panel"><a class="brand" href="../"><img src="/brand/logo-mark.svg" alt=""> voxolith <small>background</small></a> <span id="info">building…</span> <button class="theme-toggle" id="theme-toggle" type="button"></button></div>
        <div class="panel stats">
          <div class="controls"><select class="weather-select" id="sky" title="Which background module the renderer is built with" aria-label="Sky"><option value="dusk">Sky: this page's WESL</option><option value="gradient">Sky: the renderer's gradient</option></select> <select class="weather-select" id="sun" title="The sun's height above the horizon" aria-label="Sun height"></select> <button class="time-toggle" id="bands-toggle" type="button" title="Draw the gradient in flat bands" aria-pressed="false">Bands: off</button> <button class="time-toggle" id="animate-toggle" type="button" title="Stars twinkle and the water ripples, from the frame time" aria-pressed="false">Animate: off</button></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/background/main.ts"></script>
  </body>
</html>

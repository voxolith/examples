<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>effects — Voxolith Examples</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151B29" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F4EE" />
    <script>try{var t=localStorage.getItem("voxolith-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="hud"><div class="panel"><a class="brand" href="../"><img src="/brand/logo-mark.svg" alt=""> voxolith <small>effects</small></a> <span id="info">building…</span> <button class="theme-toggle" id="theme-toggle" type="button"></button></div>
        <div class="panel stats">
          <div class="controls"><button class="time-toggle" id="fire" type="button" title="Fire at a random spot on the wall (Space)">Fire</button> <select class="weather-select" id="blast" title="The explosion's size preset" aria-label="Blast size"><option value="small">Blast: small</option><option value="medium">Blast: medium</option><option value="large">Blast: large</option></select> <select class="weather-select" id="flash" title="The muzzle flash's shape" aria-label="Muzzle flash"><option value="star">Flash: star</option><option value="cone">Flash: cone</option><option value="bloom">Flash: bloom</option></select> <button class="time-toggle" id="auto-toggle" type="button" title="Keep firing" aria-pressed="false">Auto: off</button></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/effects/main.ts"></script>
  </body>
</html>

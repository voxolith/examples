<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>restyle — Voxolith Examples</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151B29" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F4EE" />
    <script>try{var t=localStorage.getItem("voxolith-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="hud"><div class="panel"><a class="brand" href="../"><img src="/brand/logo-mark.svg" alt=""> voxolith <small>restyle</small></a> <span id="info">building…</span> <button class="theme-toggle" id="theme-toggle" type="button"></button></div>
        <div class="panel stats">
          <div class="controls"><select class="weather-select" id="look" title="The palettes' colours: nothing is regenerated" aria-label="Look"></select> <button class="time-toggle" id="add" type="button" title="Generate one more tree and upload its model">Add tree</button> <button class="time-toggle" id="remove" type="button" title="Take the newest tree out and free its model">Remove tree</button></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/restyle/main.ts"></script>
  </body>
</html>
